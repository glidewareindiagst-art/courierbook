name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter (stable) ────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Firebase google-services.json from repository secret ─────────────
      # Create this secret in: GitHub → Repo → Settings → Secrets → Actions
      # Secret name:  GOOGLE_SERVICES_JSON
      # Secret value: paste the FULL contents of your google-services.json
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set — build may fail for Firebase"
            # Write a minimal stub so Gradle doesn't crash the plugin block;
            # phone auth will not work at runtime without the real file.
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "your-project-id",
              "storage_bucket": "your-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.courierbook"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "STUB_KEY" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # ── android/local.properties ─────────────────────────────────────────
      - name: Write android/local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> android/local.properties

      # ── Dependencies ─────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Static analysis ──────────────────────────────────────────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── Build APK (release) ───────────────────────────────────────────────
      - name: Build release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --split-per-abi

      # ── Build AAB (for Play Store) ────────────────────────────────────────
      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      # ── Upload APK artifact ───────────────────────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release*.apk
          retention-days: 30

      # ── Upload AAB artifact ───────────────────────────────────────────────
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
